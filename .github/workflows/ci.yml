name: qcow2-rs Build & test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build qcow2-rs on both x86_64 and i686
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - nightly
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib pkg-config libssl-dev:i386
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
      - name: Install native OpenSSL dependencies
        if: matrix.target != 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }} && rustup target add ${{ matrix.target }}
      - run: cargo build --verbose --target ${{ matrix.target }}
      - name: Test large-file offsets on i686
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: cargo test --target i686-unknown-linux-gnu --test fallocate linux_backends_keep_large_file_offsets
  test_linux:
    name: qcow2_rs ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - run: sudo apt-get install -y qemu-utils pkg-config libssl-dev
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - run: cargo build --verbose
      - run: cargo clippy --all-targets --no-deps
      - run: cargo test -- --nocapture
      - run: cargo test -r

  test_win:
    name: qcow2_rs windows
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
     - name: Checkout repository
       uses: actions/checkout@v5
     # qemu-io is in the full package, which also pulls in qemu-img.
     # https://packages.msys2.org/packages/mingw-w64-ucrt-x86_64-qemu
     - uses: msys2/setup-msys2@v2
       id: msys2
       with:
         msystem: UCRT64
         update: true
         install: mingw-w64-ucrt-x86_64-qemu
     - name: Add QEMU to the native Windows PATH
       run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
     - name: Verify modern QEMU fixture capabilities
       run: |
        $PSNativeCommandUseErrorActionPreference = $true
        qemu-img --version
        qemu-io --version
        python -c "import subprocess; h=subprocess.check_output(['qemu-img','create','-f','qcow2','-o','help'],text=True); assert all(x in h for x in ['extended_l2','data_file','compression_type','encrypt.format']),h"
     - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
     - run: rustup component add clippy
     - name: Configure the runner's OpenSSL for MSVC
       run: |
        $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
        $includeDir = Join-Path $openssl 'include'
        $libDir = Join-Path $openssl 'lib\VC\x64\MD'
        foreach ($file in @("$includeDir\openssl\ssl.h", "$libDir\libssl_static.lib", "$libDir\libcrypto_static.lib")) {
          if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
            throw "Missing OpenSSL development file $file"
          }
        }
        @(
          "OPENSSL_INCLUDE_DIR=$includeDir"
          "OPENSSL_LIB_DIR=$libDir"
          'OPENSSL_LIBS=libssl_static:libcrypto_static'
          'OPENSSL_STATIC=1'
        ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
     - run: cargo build --verbose
     - run: cargo clippy --all-targets --no-deps
     - name: Rust test(debug)
       run: |
        cargo test --no-fail-fast -- --nocapture
     - name: Rust test(release)
       run: |
        cargo test --release --no-fail-fast

  test_macos:
    name: qcow2_rs macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install fixture and crypto dependencies
        run: |
          brew install qemu pkg-config openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: qemu-img --version
      - run: cargo build --verbose
      - run: cargo clippy --all-targets --no-deps
      - run: cargo test -- --nocapture
      - run: cargo test --release

  test_freebsd:
    name: qcow2_rs FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Test native Tokio and synchronous backends in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          copyback: false
          prepare: |
            pkg install -y rust qemu pkgconf openssl
          run: |
            set -eu
            export OPENSSL_DIR=/usr/local
            export CARGO_TERM_COLOR=always
            rustc --version
            qemu-img --version
            cargo test -- --nocapture
            cargo test --release
